name: Sync Upstream Sub-Store

on:
  schedule:
    # 每天 UTC 16:00 = 北京 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制部署（即使无更新）'
        required: false
        default: 'false'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sub-store-workers
        uses: actions/checkout@v4
        with:
          path: sub-store-workers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Sub-Store (upstream)
        uses: actions/checkout@v4
        with:
          repository: sub-store-org/Sub-Store
          path: Sub-Store
          fetch-depth: 1

      - name: Checkout Sub-Store Front-End
        uses: actions/checkout@v4
        with:
          repository: sub-store-org/Sub-Store-Front-End
          ref: master
          path: Sub-Store-Front-End
          fetch-depth: 1

      - name: Get upstream version
        id: upstream
        working-directory: Sub-Store
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Upstream backend: $VERSION ($SHA)"

      - name: Get frontend upstream SHA
        id: frontend_upstream
        working-directory: Sub-Store-Front-End
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Upstream frontend SHA: $SHA"

      - name: Read last synced versions
        id: last
        working-directory: sub-store-workers
        run: |
          LAST_BACKEND=$(cat .upstream-sha 2>/dev/null || echo "none")
          LAST_FRONTEND=$(cat .upstream-frontend-sha 2>/dev/null || echo "none")
          echo "backend_sha=$LAST_BACKEND" >> $GITHUB_OUTPUT
          echo "frontend_sha=$LAST_FRONTEND" >> $GITHUB_OUTPUT
          echo "Last synced backend: $LAST_BACKEND"
          echo "Last synced frontend: $LAST_FRONTEND"

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.last.outputs.backend_sha }}" ] && [ "${{ steps.frontend_upstream.outputs.sha }}" = "${{ steps.last.outputs.frontend_sha }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed"
          fi


      - name: Setup Node
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sub-store-workers/package-lock.json

      - name: Enable corepack
        if: steps.check.outputs.needed == 'true'
        run: corepack enable

      - name: Configure upstream pnpm build scripts
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'pnpm-workspace.yaml';
          const approved = ['core-js', 'esbuild', 'nodemon'];
          let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          text = text.replace(/^onlyBuiltDependencies:\n(?:[ \t].*(?:\n|$))*/m, '');
          if (!/^packages:/m.test(text)) {
            text = `packages:\n  - .\n${text.trim() ? `\n${text.trimStart()}` : ''}`;
          }
          if (!/^allowBuilds:/m.test(text)) {
            text = `${text.replace(/\s*$/, '')}\nallowBuilds:\n`;
          }
          for (const name of approved) {
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^(\\s*${escaped}\\s*:\\s*).*$`, 'm');
            if (pattern.test(text)) {
              text = text.replace(pattern, `$1true`);
            } else {
              text = text.replace(/^allowBuilds:\n/m, `allowBuilds:\n  ${name}: true\n`);
            }
          }
          fs.writeFileSync(file, text);
          NODE
          cat pnpm-workspace.yaml

      - name: Install upstream deps
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm install --no-frozen-lockfile

      - name: Run upstream tests
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store/backend
        run: pnpm test

      - name: Install workers deps
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm ci

      - name: Run workers tests
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm test

      - name: Build worker
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: npm run build

      - name: Build official frontend
        if: steps.check.outputs.needed == 'true'
        working-directory: Sub-Store-Front-End
        run: |
          printf '%s\n' 'VITE_PUBLIC_PATH=/' > .env.production.local
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
          mkdir -p ../sub-store-workers/frontend-dist
          cp -a dist/. ../sub-store-workers/frontend-dist/

      - name: Check worker bundle size
        if: steps.check.outputs.needed == 'true'
        id: size
        working-directory: sub-store-workers
        run: |
          BYTES=$(stat -c %s dist/worker.js)
          KB=$(awk "BEGIN {printf \"%.1f\", $BYTES/1024}")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1024/1024}")
          GZIP_BYTES=$(gzip -c dist/worker.js | wc -c)
          GZIP_KB=$(awk "BEGIN {printf \"%.1f\", $GZIP_BYTES/1024}")
          echo "bytes=$BYTES" >> $GITHUB_OUTPUT
          echo "kb=$KB" >> $GITHUB_OUTPUT
          echo "mb=$MB" >> $GITHUB_OUTPUT
          echo "gzip_kb=$GZIP_KB" >> $GITHUB_OUTPUT
          echo "worker.js raw: ${KB} KB (${MB} MB), gzipped: ${GZIP_KB} KB"
          HARD_LIMIT=$((10 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$HARD_LIMIT" ]; then
            echo "::error::Worker bundle gzipped size ${GZIP_KB} KB exceeds Cloudflare 10 MiB hard limit"
            exit 1
          fi
          FREE_LIMIT=$((3 * 1024 * 1024))
          if [ "$GZIP_BYTES" -gt "$FREE_LIMIT" ]; then
            echo "::warning::Worker bundle gzipped size ${GZIP_KB} KB exceeds Cloudflare free tier 3 MiB limit (paid plan required)"
          fi

      - name: Generate wrangler.toml
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          cat > wrangler.toml <<'TOML'
          name = "sub-store-workers"
          main = "dist/worker.js"
          workers_dev = false
          routes = [{ pattern = "substore.kongguwuyin.dpdns.org", custom_domain = true }]
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat"]

          [assets]
          directory = "./frontend-dist"
          binding = "ASSETS"
          run_worker_first = true
          not_found_handling = "single-page-application"

          [[kv_namespaces]]
          binding = "SUB_STORE_DATA"
          id = "__KV_ID__"

          [triggers]
          crons = ["55 15 * * *"]

          [vars]
          SCRIPT_ENGINE = "quickjs"
          SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
          SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/Yu9191/sub-store-workers@main/png/cloudflare.png"
          TOML
          sed -i 's/^          //' wrangler.toml
          sed -i "s/__KV_ID__/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml
          echo "Generated wrangler.toml:"
          cat wrangler.toml

      - name: Verify Cloudflare API Token
        if: steps.check.outputs.needed == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "Cloudflare API Token is available"
          else
            echo "::error::Cloudflare API Token is missing or empty"
            exit 1
          fi

      - name: Deploy Workers
        # 生产 Worker 只允许从 main 分支部署；功能分支可构建和测试，不得触碰线上环境。
        if: steps.check.outputs.needed == 'true' && github.ref == 'refs/heads/main'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Workers access password
        # 密码 Secret 也只允许由 main 分支写入生产 Worker。
        if: (steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        working-directory: sub-store-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_STORE_PASSWORD_VALUE: ${{ secrets.SUB_STORE_PASSWORD_VALUE }}
        run: |
          if [ -z "$SUB_STORE_PASSWORD_VALUE" ]; then
            echo "::error::SUB_STORE_PASSWORD_VALUE is empty"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty; check the GitHub Actions secret"
            exit 1
          fi
          case "$SUB_STORE_PASSWORD_VALUE" in
            /*) ;;
            *) echo "::error::Password must start with /"; exit 1 ;;
          esac
          printf '%s' "$SUB_STORE_PASSWORD_VALUE" | npx --yes wrangler@4.129.0 secret put SUB_STORE_FRONTEND_BACKEND_PATH --name sub-store-workers

      - name: Health check
        if: steps.check.outputs.needed == 'true' && github.ref == 'refs/heads/main'
        run: |
          URL="https://substore.kongguwuyin.dpdns.org"
          for i in 1 2 3; do
            sleep 10
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Frontend homepage returned HTTP 200"
              exit 0
            fi
            echo "Expected HTTP 200 from frontend homepage; got $CODE"
          done
          echo "Worker health check failed"
          exit 1

      - name: Write job summary
        if: always() && steps.check.outputs.needed == 'true'
        run: |
          {
            echo "## Sub-Store Workers 同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 后端版本 | `${{ steps.upstream.outputs.version }}` |"
            echo "| 当前后端 SHA | `${{ steps.upstream.outputs.sha }}` |"
            echo "| 上次后端 SHA | `${{ steps.last.outputs.backend_sha }}` |"
            echo "| 当前前端 SHA | `${{ steps.frontend_upstream.outputs.sha }}` |"
            echo "| 上次前端 SHA | `${{ steps.last.outputs.frontend_sha }}` |"
            echo "| Worker 原始大小 | ${{ steps.size.outputs.kb }} KB (${{ steps.size.outputs.mb }} MB) |"
            echo "| Worker gzip 大小 | ${{ steps.size.outputs.gzip_kb }} KB |"
            echo ""
            if [ "${{ steps.last.outputs.backend_sha }}" != "none" ] && [ "${{ steps.last.outputs.backend_sha }}" != "${{ steps.upstream.outputs.sha }}" ]; then
              echo "**后端 diff**: https://github.com/sub-store-org/Sub-Store/compare/${{ steps.last.outputs.backend_sha }}...${{ steps.upstream.outputs.sha }}"
            fi
            if [ "${{ steps.last.outputs.frontend_sha }}" != "none" ] && [ "${{ steps.last.outputs.frontend_sha }}" != "${{ steps.frontend_upstream.outputs.sha }}" ]; then
              echo "**前端 diff**: https://github.com/sub-store-org/Sub-Store-Front-End/compare/${{ steps.last.outputs.frontend_sha }}...${{ steps.frontend_upstream.outputs.sha }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update upstream version markers
        if: steps.check.outputs.needed == 'true'
        working-directory: sub-store-workers
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > .upstream-sha
          echo "${{ steps.frontend_upstream.outputs.sha }}" > .upstream-frontend-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream-sha .upstream-frontend-sha
          git commit -m "chore: sync upstream versions [skip ci]" || exit 0
          git push


      - name: Bark notify success
        if: steps.check.outputs.needed == 'true' && success() && env.BARK_KEY != ''
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          TITLE=$(printf 'Sub-Store %%E5%%B7%%B2%%E6%%9B%%B4%%E6%%96%%B0' | sed 's/%%/%/g')
          curl -s "https://api.day.app/${BARK_KEY}/Sub-Store%20${{ steps.upstream.outputs.version }}/Workers%20deployed"

      - name: Bark notify failure
        if: failure() && env.BARK_KEY != ''
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VER="${UPSTREAM_VERSION:-unknown}"
          TITLE="Sub-Store%20Sync%20Failed%20${VER}"
          BODY=$(printf '%s' "${RUN_URL}" | sed 's/:/%3A/g; s|/|%2F|g')
          curl -s "https://api.day.app/${BARK_KEY}/${TITLE}/${BODY}"
